# =============================================================================
# AI-First Software Factory — Intake: tennis-coach
# =============================================================================

id: tennis-coach

type: web-saas

description: 'Mobile-first web app for structured tennis match analysis, opponent profiling and AI-coached self-development for club-level players'

problem_statement: |
  Club tennis beginners have no system to retain observations between matches.
  Every match starts at zero — patterns noticed about opponents are forgotten,
  tactical insights from losses are never revisited, and personal improvement
  goals are never tracked against actual match behaviour.
  They need a lightweight mobile tool that stores growing opponent profiles,
  guides pre-match preparation, delivers AI tactical recommendations during
  changeovers (30 seconds), and captures post-match retrospectives — all
  without requiring a printer, notebook or desktop.

target_users:
  - 'Club tennis beginner (Dorfverein), plays matches against a known pool of ~16 recurring opponents'
  - 'Self-coaching player who wants structured improvement without a human coach'

cli_language: ''
mcu_platform: ''

# ---------------------------------------------------------------------------
# FEATURES (MVP)
# ---------------------------------------------------------------------------
features:
  - name: 'player-list'
    description: |
      Display all players in a scrollable list. Each entry shows: name,
      matches played count, last match date, and a colour indicator
      (grey = no profile yet, yellow = partial, green = known lever).
      Button "+ Add Player" opens a minimal form (name only).
      Predefined list of 16 players is seeded on first launch:
      Inninger Marco, Pauker Niklas, Maier Michael, Ott Josef, Burger Stefan,
      Schmidhuber Tobias, Ammon Björn, Brück Philipp, Inninger Christoph,
      Bleicher Stephan, Ortlieb Matthias, Meier Martin, Polatzky Martin,
      Sleik Rudi, Deutsch Stephan, Köbinger Markus.
      Supports two entry modes: "Play" and "Observe" — selectable per player tap.

  - name: 'player-profile'
    description: |
      Per-player profile screen with three sections:
      1. CLUSTER STABILITY: Raum / Höhe / Mental — each shown as
         stabil / instabil / unknown, with last-updated date and free-text context.
         Sub-levers displayed: Cross (Raum), Drop (Raum), Tief (Höhe), Hoch (Höhe).
      2. MATCH HISTORY: chronological list of matches — date, result (W/L/score),
         one-line key observation per match. Tappable to expand full notes.
      3. AI SUMMARY: one paragraph generated by Claude on demand, describing
         what this specific player demands from the user based on all stored data.
         Regenerates after each new match entry.
      Profile grows automatically after every match or observation session.

  - name: 'goal-library'
    description: |
      Persistent library of personal playing goals, grouped into 5 categories.
      Predefined goals seeded on first launch (17 goals total):

      BEWEGUNG & POSITION (6):
      - Laufen! Immer in Bewegung bleiben. Splitstep, Pause-Step, Cross-Step – um alle Bälle zu erreichen.
      - Breiten Stand wählen (Split-Step). Für Gleichgewicht und Reaktion bei Richtungswechsel.
      - Optimale horizontale Position. Immer zwischen den zwei besten Winkeln stehen.
      - Optimale vertikale Position. Immer 1,5m hinter der Grundlinie stehen für Sicherheit.
      - V-Movement. Dem Ball entgegengehen, Weg abschneiden – kürzerer Weg, höheres Returnpotential.
      - Return-Beinarbeit. Splitstep sobald der Gegner beim Aufschlag den Ball trifft.

      SCHLAGTECHNIK (4):
      - Handgelenk frei halten. Peitscheffekt nutzen, durchschwingen, Griff vor Schlag öffnen.
      - Früh vorbereiten. Im Laufen und während der Ball übers Netz fliegt bereits vorbereitet sein.
      - Einhändige Rückhand: zweiten Arm für Kontrolle und Gleichgewicht nutzen.
      - In den Ball gehen. Körper in Schlagrichtung bewegen – Druck aufbauen und Ballsicherheit gewinnen.

      TAKTIK & STRATEGIE (4):
      - Cross-Winkel steil spielen. Ball zuerst über die Seitenlinie, dann Grundlinie – Gegner aus dem Feld bewegen.
      - Ghost Net Run. Ans Netz laufen, wenn Gegner unter Druck und auf den Ball fixiert ist.
      - Return tief ins Zentrum, falls Gegner nach Aufschlag nicht zurückgeht – er muss aus Rückwärtslage schlagen.
      - Return als Drive. Keine Ausholbewegung bei zu wenig Zeit – sicher und kontrolliert zurückspielen.

      AUFSCHLAG (2):
      - Open Toss. Handfläche öffnen beim Werfen, damit der Ball gerade fliegt.
      - Serve auf T. Flach durch Slice – maximale Unbequemlichkeit für den Gegner.

      KÖRPER & AUSRICHTUNG (1):
      - Vor- und Rückhand-Körperhaltung auf dominantes linkes Auge ausrichten für optimalen Treffpunkt.

      New goals can be added via free-text input on the pre-match screen.
      New goals are automatically saved to the library and assigned a category
      (user selects from dropdown or leaves as "Sonstige").
      Goals can be archived but not deleted (history integrity).

  - name: 'pre-match'
    description: |
      Pre-match preparation screen. Accessed by tapping a player and selecting "Play".
      Flow:
      1. Show player profile summary (last known levers, AI one-liner if available).
      2. Goal selection: show goal library grouped by category (collapsible).
         User taps exactly 3 goals. Selected goals are highlighted.
         "Add new goal" text field at the bottom — saves to library on submit.
      3. AI Briefing button: calls Claude API with player profile + selected goals.
         Returns exactly one sentence: tactical entry hypothesis for this match.
         Example: "Cross auf die Rückhand war letztes Match der stärkste Hebel –
         beginne dort und validiere ab Game 3."
      4. "Match starten" button records match start timestamp and navigates
         to match-view.
      Entire screen interaction target: under 2 minutes.

  - name: 'match-view'
    description: |
      In-match screen, optimised for 30-second changeover interaction.
      Layout (single scrollable screen, large touch targets):

      CLUSTER STATUS (3 toggle groups):
        - RAUM:   [Stabil] [Instabil] [?]
        - HÖHE:   [Stabil] [Instabil] [?]
        - MENTAL: [Stabil] [Instabil] [?]

      OBSERVATION (optional free-text, max 100 chars, single line):
        Placeholder: "Beobachtung (optional)…"

      AI RECOMMENDATION (auto-updates on any cluster tap):
        One sentence from Claude. Bold. Large font.
        Example: "Raum instabil – Cross-Dauerbelastung, Tempo nicht erhöhen."

      DYNAMIC RETEST BLOCK (collapsible, shown at satzwechsel prompt):
        Three trigger rows — Satzwechsel / Break gegen mich / 3 Games in Folge.
        Per trigger: checkbox per cluster (Raum/Höhe/Mental) "verändert?" + one-line note.

      MY GOALS reminder (collapsed by default, expandable):
        Shows the 3 selected goals as a quick reminder.

      SCORE INPUT (optional): simple W/L + games score fields.

      "Match beenden" button → navigates to retrospective.

      OBSERVATION MODE variant: same screen but with two-player switcher tab at top.
      User taps player name to assign each observation to the correct player.
      Both players' cluster states tracked independently.

  - name: 'retrospective'
    description: |
      Post-match reflection screen. Two blocks, 6 questions total.

      BLOCK 1 — EIGENE ZIELE (3 questions, one per selected goal):
        Per goal: "Habe ich [goal short label] gespielt?"
        Answer options: Ja / Teilweise / Nein
        Optional one-line note per goal.

      BLOCK 2 — ANALYSE-QUALITÄT (3 questions):
        Q1: "Welcher Cluster war der stärkste Hebel?" (Raum / Höhe / Mental / Keiner)
        Q2: "Wo habe ich ein Signal gesehen und es NICHT genutzt?" (free text, optional)
        Q3: "Was teste ich nächstes Mal anders?" (free text, optional)

      AI SYNERGY FEEDBACK (auto-generated on submit):
        Claude evaluates which of the 3 goals had synergy with the match's
        strongest lever. Returns 2–3 sentences maximum.
        Example: "V-Movement und Cross-Dauerbelastung haben sich direkt verstärkt.
        Open Toss war technisch unverbunden mit dem Raum-Hebel – neutral.
        Nächstes Match: Höhe noch ungetestet – hohen Topspin auf Rückhand in Games 4–6 testen."

      On submit: player profile auto-updated with all new observations.
      Match saved to history.

  - name: 'progress-view'
    description: |
      Season overview screen. Three simple sections:

      1. EIGENE ZIELE: Bar or percentage per goal category showing
         how often goals were rated Ja / Teilweise / Nein across all matches.
         Identifies which goals are consistently achieved vs. dropped under pressure.

      2. CLUSTER-ÜBERSICHT: For all matches combined — which cluster
         was most frequently identified as a lever. Simple bar chart.

      3. MATCH-HISTORY: Scrollable list of all matches — date, opponent,
         W/L, strongest lever noted. Tappable to view full retrospective.

      No complex statistics. Mobile-readable at a glance.

# ---------------------------------------------------------------------------
# OUT OF SCOPE (v1)
# ---------------------------------------------------------------------------
out_of_scope:
  - 'User authentication / accounts — single-user local app, no login required'
  - 'Cloud sync or multi-device support — v2'
  - 'Push notifications or match reminders — v2'
  - 'Video or photo attachments — v2'
  - 'Social features or sharing profiles — never'
  - 'Native iOS/Android app — web only'
  - 'Opponent self-registration or opponent-facing features'
  - 'Statistical analysis beyond the three progress metrics'
  - 'Real-time match scoring integration'

# ---------------------------------------------------------------------------
# INTEGRATIONS
# ---------------------------------------------------------------------------
integrations:
  - service: 'Anthropic Claude API'
    purpose: |
      Powers all AI coaching responses. Used in four moments:
      (1) Pre-match briefing: one-sentence tactical entry hypothesis.
      (2) Match changeover: one-sentence recommendation based on cluster taps + observation + player profile.
      (3) Retest moment: one-sentence adaptation signal when cluster state changes vs. previous set.
      (4) Post-match synergy feedback: 2-3 sentences evaluating goal/lever combinations.
      All prompts include: full cluster system definition, current player profile,
      selected goals, and current match observations. Responses are strictly length-limited.
      Model: claude-sonnet-4-20250514. Max tokens per call: 150.
    env_vars:
      - ANTHROPIC_API_KEY

# ---------------------------------------------------------------------------
# DATA MODEL
# ---------------------------------------------------------------------------
data_model:
  - 'Player: id, name, is_predefined (bool), created_at; linked to Profile'
  - 'Profile: player_id, raum_status (stabil|instabil|unknown), raum_sublever (cross|drop|both|none), höhe_status, höhe_sublever (tief|hoch|both|none), mental_status, mental_pattern (risiko_hoch|risiko_runter|konstant|unknown), kondition_note (text), ai_summary (text), updated_at'
  - 'Match: id, player_id, date, mode (play|observe), result (W|L|null), score (text), started_at, ended_at'
  - 'MatchObservation: match_id, set_number, cluster (raum|höhe|mental), status (stabil|instabil), note (text), created_at'
  - 'RetroEntry: match_id, goal_1_id, goal_1_result (ja|teilweise|nein), goal_1_note, goal_2_id, goal_2_result, goal_2_note, goal_3_id, goal_3_result, goal_3_note, strongest_lever, missed_signal_note, next_test_note, ai_synergy_feedback (text)'
  - 'Goal: id, text (full description), short_label (max 40 chars), category (bewegung|technik|taktik|aufschlag|koerper|sonstige), is_predefined (bool), is_archived (bool), created_at'
  - 'RetestEntry: match_id, trigger (satzwechsel|break|drei_games), raum_changed (bool), höhe_changed (bool), mental_changed (bool), note (text), created_at'

# ---------------------------------------------------------------------------
# NON-FUNCTIONAL REQUIREMENTS
# ---------------------------------------------------------------------------
non_functional:
  target_concurrent_users: 1
  uptime_sla: 'best-effort'
  page_load_target_seconds: 2

  # Match-view changeover interaction must complete within 30 seconds total
  # including AI response. Claude API call must feel instant — use streaming.
  ai_response_target_seconds: 3

  accessibility: 'WCAG 2.1 AA'

  supported_browsers:
    - 'Chrome >= 120'
    - 'Firefox >= 120'
    - 'Safari >= 17'
    - 'Edge >= 120'

  mobile_responsive: true

  # All data stored in browser (localStorage/IndexedDB). No server-side storage.
  # Single user, no authentication required.
  storage: 'browser-local'

  data_regions:
    - 'EU'

  # Touch targets minimum 48x48px (critical — used on phone during matches)
  touch_target_min_px: 48

  # App must function offline after first load (except AI features)
  offline_capable: true

# ---------------------------------------------------------------------------
# DESIGN
# ---------------------------------------------------------------------------
design:
  palette_hint: |
    Primary: deep navy blue (#1F4E79) for headers and section markers.
    Secondary: teal (#1D6B6B) for Höhe cluster.
    Accent positive: soft green (#E2EFDA / #375623) for stable / achieved.
    Accent negative: soft red (#FCE4D6 / #C00000) for instabil / signal.
    Accent neutral: yellow (#FFF2CC / #7F6000) for uncertain / partial.
    Background: white with light grey (#F2F2F2) cards.
    All colours already defined in existing analysis documents.

  dark_mode: false

  ui_references:
    - 'Notion mobile (clean card layout, large touch targets)'
    - 'Strava (post-activity summary flow)'

  additional_ux_notes: |
    - Match-view is the most critical screen. Optimise ruthlessly for speed.
    - Large font sizes throughout (minimum 16px body, 20px+ for AI recommendations).
    - Every screen must be operable one-handed in portrait orientation.
    - No horizontal scrolling anywhere.
    - AI responses always displayed in a visually distinct card (blue background,
      white text) so the user immediately knows where to look.
    - Goal selection in pre-match uses large checkbox cards, not small checkboxes.
    - Cluster tap buttons in match-view must be at least 80px tall.

# ---------------------------------------------------------------------------
# INFRASTRUCTURE
# ---------------------------------------------------------------------------
infrastructure:
  supabase_region: 'eu-central-1'
  vercel_project_name: 'tennis-coach'
  custom_domain: ''

  # Note: Supabase is used only for potential future sync.
  # v1 stores all data in browser localStorage/IndexedDB.
  # Supabase Auth and DB are NOT required for v1.
  # The only external call in v1 is to the Anthropic API (client-side, proxied
  # through a minimal Next.js API route to protect the API key).

# ---------------------------------------------------------------------------
# NOTES FOR SPEC-AGENT
# ---------------------------------------------------------------------------
notes: |
  ## Core design philosophy
  This is a single-user tool. No multi-tenancy, no accounts, no sync in v1.
  All state lives in the browser. The API key is the only secret.

  ## The 3-Cluster analysis system (critical domain knowledge)
  The entire app is built around this framework. The spec-agent must understand it:

  CLUSTER 1 — RAUM (Phase 1, Games 1-3):
    Tests whether opponent stays stable under positional pressure.
    Test 1 (Cross): Play 3-5 cross balls to backhand. Signal: longline attempt after ball 3,
      fewer than 2/3 balls land deep, panic footwork.
      Tactic if instabil: sustained cross pressure, NO tempo increase, patience.
    Test 2 (Drop): Deep ball → drop shot. Signal: late arrival, short high return, lost balance.
      Tactic if instabil: deep → drop → lob combination, vary length every 3rd rally.

  CLUSTER 2 — HÖHE (Phase 2, Games 4-6):
    Tests which contact height zone causes instability.
    Test 3 (Tief, under knee): Slice/flat balls. Signal: upright posture, slice goes high over net,
      net errors, short balls.
      Tactic if instabil: more slice + flat, alternate low/high for contrast.
    Test 4 (Hoch, shoulder+): Slow steep topspin to backhand. Signal: retreat behind baseline,
      short ball to centre, torso tips back, rhythm breaks.
      Tactic if instabil: high → immediate flat + direction change.

  CLUSTER 3 — MENTAL (parallel, all phases):
    Observe only at 3 moments: after own error, at 30:30, at break point.
    Pattern A (risk increases): harder/flatter shots, more net errors, faster decisions.
      Tactic: reduce tempo, high spin to centre, no own risk.
    Pattern B (risk decreases): more height/spin, retreat, longer rallies.
      Tactic: increase tempo, attack early.

  DYNAMIC RETEST (3 triggers):
    1. Set change: one question — has anything changed since the set began?
    2. Break against me: am I still playing my lever, or have I drifted?
    3. 3 games lost in a row: is a new lever emerging (often fitness-related)?

  FITNESS as amplifier (not separate cluster):
    Fitness weaknesses manifest as temporal degradation of already-identified instabilities.
    A player stable in cross at Game 2 may be unstable there at Game 9.
    The retest block captures this. No separate fitness cluster needed.

  ## Mouratoglou goal principle
  3 own goals per match = things the player controls regardless of result.
  "You win if you played your goals." Score is secondary.
  Goals and levers can have synergy (V-Movement + Cross pressure = direct reinforcement)
  or be neutral (Open Toss + Raum lever = technically unconnected).
  The AI synergy feedback after each match surfaces this pattern over time.

  ## AI prompt guidelines
  All Claude calls must include:
  - Full cluster system definition (as context, can be a system prompt)
  - Current player profile (serialized)
  - Current match state (cluster taps, observations, score if available)
  - Selected goals (for pre-match and retrospective calls)
  Response format: plain text, no markdown, no bullet points, max 2 sentences
  (1 sentence for changeover calls, 2-3 for retrospective synergy).
  Temperature: 0.3 (consistent tactical advice, not creative variation).

  ## Observation mode
  When user selects "Observe" instead of "Play":
  - No own goals set (not playing)
  - Two players selected from list
  - Match-view shows player toggle tab at top
  - All observations attributed to the selected player
  - Both profiles updated on save
  - AI output is strategic ("what will help you against Player A next week")
    rather than tactical ("what to do right now")
  - No retrospective for own goals (only analysis quality block)
